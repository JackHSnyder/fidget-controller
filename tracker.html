<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hands-free camera and key-click tracking for a fidget toy." />
    <title>Fidget Controller · Tracker</title>

  <body>
    <main>
      <h1>Fidget tracker</h1>
